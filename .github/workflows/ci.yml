name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Prepare offline fallback snapshots
        run: |
          python scripts/snapshot_data.py --offline

      - name: Lint with ruff
        run: |
          ruff check src/ scripts/ tests/

      - name: Run unit tests (no network)
        env:
          WORKSHOP_FORCE_FALLBACK: "1"
          WORKSHOP_OFFLINE: "1"
        run: |
          pytest -v tests/test_unit.py

      - name: Verify starter notebook generation and execute solution notebook
        env:
          WORKSHOP_FORCE_FALLBACK: "1"
          WORKSHOP_OFFLINE: "1"
        run: |
          pytest -v tests/test_notebooks.py
